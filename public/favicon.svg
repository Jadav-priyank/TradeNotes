<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="bullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="bearGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Icon Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#6366f1" stroke-width="2.5" />

  <!-- Candlestick 1: Red (Bearish) -->
  <line x1="16" y1="20" x2="16" y2="44" stroke="#f87171" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <rect x="12" y="24" width="8" height="12" rx="2" fill="url(#bearGrad)" />

  <!-- Candlestick 2: Green (Bullish) -->
  <line x1="32" y1="14" x2="32" y2="42" stroke="#34d399" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <rect x="28" y="20" width="8" height="16" rx="2" fill="url(#bullGrad)" />

  <!-- Candlestick 3: Strong Green (Bullish) -->
  <line x1="48" y1="8" x2="48" y2="36" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
  <rect x="44" y="12" width="8" height="15" rx="2" fill="url(#bullGrad)" />

  <!-- Upward Trendline & Breakout Peak -->
  <path d="M10 46 Q 26 38, 36 24 T 54 12" fill="none" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
  <circle cx="54" cy="12" r="4" fill="#34d399" filter="url(#glow)" />
</svg>
