openapi: 3.0.3
info:
  title: Notes API
  version: 1.0.0
  description: >
    A RESTful Notes API with private user notes, search by title, and date filtering.
    Includes JWT authentication, SQLite persistence, and comprehensive query parameters.
servers:
  - url: http://localhost:3000
    description: Local Development Server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: john_doe
        email:
          type: string
          example: john@example.com
        created_at:
          type: string
          format: date-time
          example: "2026-09-11 11:00:00"

    Note:
      type: object
      properties:
        id:
          type: integer
          example: 10
        userId:
          type: integer
          example: 1
        title:
          type: string
          example: "Architecture Brainstorming"
        content:
          type: string
          example: "Discuss microservices vs monolith and caching strategies."
        tags:
          type: array
          items:
            type: string
          example: ["work", "architecture"]
        createdAt:
          type: string
          example: "2026-09-11 11:00:00"
        updatedAt:
          type: string
          example: "2026-09-11 11:00:00"

    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"

paths:
  /api/auth/register:
    post:
      summary: Register a new user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
              properties:
                username:
                  type: string
                  example: john_doe
                email:
                  type: string
                  example: john@example.com
                password:
                  type: string
                  format: password
                  example: "secret123"
      responses:
        201:
          description: User registered successfully
        400:
          description: Validation error
        409:
          description: Username or email already taken

  /api/auth/login:
    post:
      summary: Log in with username/email and password
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                username:
                  type: string
                  example: john_doe
                email:
                  type: string
                  example: john@example.com
                password:
                  type: string
                  format: password
                  example: "secret123"
      responses:
        200:
          description: Login successful, returns JWT
        401:
          description: Invalid credentials

  /api/auth/me:
    get:
      summary: Get current authenticated user profile and stats
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        200:
          description: Current user profile
        401:
          description: Unauthorized

  /api/notes:
    post:
      summary: Create a private note
      tags:
        - Notes
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - content
              properties:
                title:
                  type: string
                  example: "Q3 Strategy Meeting"
                content:
                  type: string
                  example: "Review project milestones and sprint velocity."
                tags:
                  type: array
                  items:
                    type: string
                  example: ["work", "planning"]
      responses:
        201:
          description: Note created successfully
        400:
          description: Missing or invalid title/content
        401:
          description: Unauthorized

    get:
      summary: List user's private notes with search and date filters
      tags:
        - Notes
      security:
        - bearerAuth: []
      parameters:
        - name: title
          in: query
          description: Filter notes containing this title keyword (case-insensitive)
          schema:
            type: string
            example: "strategy"
        - name: search
          in: query
          description: Search across title and content
          schema:
            type: string
            example: "sprint"
        - name: date
          in: query
          description: Filter notes created on specific date (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2026-09-11"
        - name: startDate
          in: query
          description: Filter notes created on or after date (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2026-09-01"
        - name: endDate
          in: query
          description: Filter notes created on or before date (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2026-09-30"
        - name: sortBy
          in: query
          description: Sort field (createdAt, updatedAt, title)
          schema:
            type: string
            enum: [createdAt, updatedAt, title]
            default: createdAt
        - name: order
          in: query
          description: Sort order (asc or desc)
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Items per page (max 100)
          schema:
            type: integer
            default: 10
      responses:
        200:
          description: List of notes matching filters
        401:
          description: Unauthorized

  /api/notes/summary:
    get:
      summary: Get note count and timeline breakdown for current user
      tags:
        - Notes
      security:
        - bearerAuth: []
      responses:
        200:
          description: Summary statistics
        401:
          description: Unauthorized

  /api/notes/{id}:
    get:
      summary: Get a private note by ID
      tags:
        - Notes
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Note details
        404:
          description: Note not found
        401:
          description: Unauthorized

    put:
      summary: Update a private note by ID
      tags:
        - Notes
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
      responses:
        200:
          description: Note updated
        404:
          description: Note not found
        401:
          description: Unauthorized

    delete:
      summary: Delete a private note by ID
      tags:
        - Notes
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Note deleted
        404:
          description: Note not found
        401:
          description: Unauthorized
